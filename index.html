<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Úthírnök</title>
  <meta name="description" content="Navigáció közösségi jelzésekkel: rendőr, traffipax, baleset, dugó, veszély, benzinárak, parkolás.">
  <meta name="theme-color" content="#0f1724">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- Felső sáv: keresés -->
  <header id="topbar">
    <div class="search">
      <span class="search-ico">⌕</span>
      <input id="q" type="search" placeholder="Hová mész?" autocomplete="off" enterkeyhint="search">
      <button id="btnSettings" class="icon-btn" title="Beállítások">⚙</button>
    </div>
    <ul id="results" class="hidden"></ul>
  </header>

  <!-- Navigációs manőver-sáv -->
  <section id="maneuver" class="hidden">
    <div class="mv-arrow" id="mvArrow">↑</div>
    <div class="mv-text">
      <div class="mv-dist" id="mvDist">–</div>
      <div class="mv-instr" id="mvInstr">–</div>
    </div>
  </section>

  <!-- Figyelmeztetés (jelzés előttünk) -->
  <section id="alert" class="hidden">
    <div class="al-ico" id="alIco">⚠</div>
    <div class="al-text">
      <div class="al-title" id="alTitle">–</div>
      <div class="al-sub" id="alSub">–</div>
    </div>
    <div class="al-actions hidden" id="alActions">
      <button class="pill ok" id="alYes">Még ott van</button>
      <button class="pill no" id="alNo">Már nincs</button>
    </div>
  </section>

  <!-- Sebesség + korlát -->
  <div id="speedo">
    <div class="spd" id="spd"><b id="spdVal">0</b><small>km/h</small></div>
    <div class="limit hidden" id="limit"><span id="limitVal">50</span></div>
  </div>

  <!-- Jobb oldali gombok -->
  <div id="fabs">
    <button class="fab" id="btnLayers" title="Rétegek">◫</button>
    <button class="fab" id="btnLocate" title="Saját hely">◎</button>
  </div>
  <button id="btnReport" title="Jelzés">
    <span>＋</span><small>Jelzés</small>
  </button>

  <!-- Alsó lap (útvonalak, hely, navigáció) -->
  <section id="sheet" class="hidden">
    <div class="grab"></div>
    <div id="sheetBody"></div>
  </section>

  <!-- Jelzés-választó -->
  <div id="modal" class="hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Mit jelzel?</h2>
        <button class="icon-btn" id="modalClose">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <div id="mode-badge"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="js/version.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/routing.js"></script>
  <script src="js/pois.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
